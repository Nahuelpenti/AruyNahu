<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Mi Amor ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff4d6d, #ff8fab, #ffc2d1);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      text-align: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.12);
      padding: 40px;
      border-radius: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 750px;
      width: 90%;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .heart {
      font-size: 4rem;
      animation: pulse 1.4s infinite;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.4rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
    }

    .box {
      background: rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 20px;
    }

    .number {
      font-size: 2rem;
      font-weight: bold;
    }

    .label {
      margin-top: 8px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .footer {
      margin-top: 30px;
      font-size: 0.95rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Página en preparación para mi amor</h1>

    <div class="heart">❤️</div>

    <p>Te amo</p>

    <div class="countdown">
      <div class="box">
        <div class="number" id="months">0</div>
        <div class="label">Meses</div>
      </div>

      <div class="box">
        <div class="number" id="days">0</div>
        <div class="label">Días</div>
      </div>

      <div class="box">
        <div class="number" id="hours">0</div>
        <div class="label">Horas</div>
      </div>

      <div class="box">
        <div class="number" id="seconds">0</div>
        <div class="label">Segundos</div>
      </div>
    </div>
  </div>

  <script>
    // Fecha inicial y final
    const startDate = new Date(2026, 4, 17); // 17 mayo 2026
    const targetDate = new Date(2026, 8, 2, 0, 0, 0); // 2 septiembre 2026

    function updateCountdown() {
      const now = new Date();

      // Diferencia total
      const diff = targetDate - now;

      if (diff <= 0) {
        document.querySelector(".countdown").innerHTML = `
          <div style="grid-column: 1/-1; font-size: 2rem;">
            ❤️ Ya llegó el 2 de septiembre ❤️
          </div>
        `;
        return;
      }

      // Calcular meses y días restantes reales
      let months = targetDate.getMonth() - now.getMonth();
      let years = targetDate.getFullYear() - now.getFullYear();

      months += years * 12;

      let tempDate = new Date(now);
      tempDate.setMonth(tempDate.getMonth() + months);

      // Ajuste si se pasa
      if (tempDate > targetDate) {
        months--;
        tempDate = new Date(now);
        tempDate.setMonth(tempDate.getMonth() + months);
      }

      const remainingMs = targetDate - tempDate;
      const days = Math.floor(remainingMs / (1000 * 60 * 60 * 24));

      // Horas y segundos del día actual restante
      const hours = 23 - now.getHours();
      const seconds =
        (59 - now.getMinutes()) * 60 +
        (60 - now.getSeconds());

      document.getElementById("months").innerText = months;
      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("seconds").innerText = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
